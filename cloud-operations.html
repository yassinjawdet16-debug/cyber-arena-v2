<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Arena Cloud Operations</title><style>body{background:#090d18;color:#f2f5ff;font:16px system-ui;margin:0;padding:20px}main{max-width:680px;margin:auto}section{background:#162039;padding:18px;border-radius:14px;margin:12px 0}input,button,select{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border-radius:8px;font:inherit}input,select{background:#0b1221;color:white;border:1px solid #45516a}button{background:#31e6a1;color:#07140f;border:0;font-weight:bold}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Cyber Arena — Cloud Operations</h1><p>Development-only cloud transaction console. Does not import or modify local browser records. Do not use with live income before owner verification and migration tests.</p><section><h2>Owner connection</h2><input id="url" placeholder="Supabase HTTPS URL"><input id="key" placeholder="Publishable key"><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in and read cloud</button><button id="refresh">Refresh cloud</button><pre id="status">Not connected</pre></section><section><h2>Station transaction</h2><select id="station"></select><select id="action"><option value="start">Start open session</option><option value="startTimed">Start timed session</option><option value="extend">Extend timer</option><option value="discount">Set fixed discount</option><option value="finish">Finish session and create bill</option></select><input id="number" type="number" value="30" placeholder="Minutes or discount IQD"><button id="apply">Submit cloud transaction</button></section><section><h2>Extra sale</h2><input id="saleName" placeholder="Product"><input id="qty" type="number" value="1"><input id="price" type="number" value="500"><button id="sale">Record sale</button></section><section><h2>Cash adjustment</h2><input id="description" placeholder="Description"><input id="amount" type="number" step="250" value="250"><button id="cash">Record cash movement</button></section><pre id="result" aria-live="polite">No changes made</pre></main><script type="module" src="./cloud/operations-ui.mjs"></script></body></html>
