name: Deploy Cyber Arena V2 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloud/**'
      - 'i18n/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cyber-arena-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate entrypoint and required scripts
        run: |
          test -s index.html
          test -s cloud/cloud-sync.js
          test -s i18n/languages.js
          node --check cloud/cloud-sync.js
          node --check i18n/languages.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const js=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!js)throw Error('Missing inline JS'); new Function(js[1]); for(const x of ['editBillDiscount','billArchiveDate','toggleArenaMenu','unprintedBills','printedBills'])if(!html.includes(x))throw Error('Missing '+x); console.log('Inline JavaScript and billing controls validated')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
