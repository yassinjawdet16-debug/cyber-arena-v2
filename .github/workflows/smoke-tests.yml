name: Cyber Arena V2 smoke tests

on:
  push:
    branches:
      - cyber-arena-v2-safe-updates
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test printer bridge
        run: python -m unittest tests.test_printer_bridge
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run smoke tests
        run: node --test tests/smoke.test.mjs tests/cloud-client.test.mjs
