name: Cyber Arena Safety Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw Error('No inline scripts found');
          scripts.forEach((m, i) => new vm.Script(m[1], { filename: 'inline-' + i + '.js' }));
          NODE
      - name: Check cloud and language scripts
        run: |
          node --check cloud/cloud-sync.js
          node --check i18n/languages.js
      - name: Run safety checks
        run: node tests/safety.test.cjs
