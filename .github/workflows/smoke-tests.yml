name: Cyber Arena V2 smoke tests

on:
  push:
    branches:
      - cyber-arena-v2-safe-updates
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke tests
        run: node --test tests/smoke.test.mjs
